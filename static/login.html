<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rcfb sign in</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<form class="login" method="post" action="/login">
  <h1>rcfb</h1>
  <input name="username" value="Root" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
  <p class="error" id="error" hidden>Invalid credentials</p>
</form>
<script>
const error = document.getElementById("error");
const reason = new URLSearchParams(location.search).get("error");
if (reason === "locked") {
  error.textContent = "Too many failed attempts. Try again later.";
  error.hidden = false;
} else if (reason !== null) {
  error.hidden = false;
}
</script>
</body>
</html>
